[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-evaluation"
version = "0.1.0"
description = "Lightweight Artificial Analysis-style metrics for coding-agent harness results"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harness-eval = "harness_evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
